[package]
name = "living_worlds"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"
bevy_egui = "0.43"
noise = "0.9"
rand = "0.8"
rand_chacha = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
